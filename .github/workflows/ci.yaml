name: CI Workflow

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the repo
        uses: actions/checkout@v4

      - name: download OS level dependencies/ download Node.js
        uses: actions/setup-node@v4 
        with:
          node-version: '20'

      - name: Cache Node modules
        id: cache-node-nodules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node

      - name: download project level dependenceis/ download npm packages
        run: npm install

      - name: Build project
        run: npm run build

  unit-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: download Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node modules
        id: cache-node-nodules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node

      - name: download npm packages
        if: steps.cache-node-nodules.outputs.cache-hit != true
        run: npm install

      - name: Run Unit tests
        run: npm test
